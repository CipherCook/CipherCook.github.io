name: Update blog stats

on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      
      - name: Check API key
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          if [ -z "$GOATCOUNTER_API_KEY" ]; then
            echo "API key is EMPTY"
            exit 1
          fi
          echo "API key is present"

      - name: Debug GoatCounter request
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "API key length: ${#GOATCOUNTER_API_KEY}"

          curl -i \
            -u ":$GOATCOUNTER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://ciphercook.goatcounter.com/api/v0/stats/total?start=2026-07-01T00:00:00Z&end=$(date -u '+%Y-%m-%dT23:59:59Z')"

      - name: Fetch GoatCounter stats
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: |
          mkdir -p _data

          curl --fail --silent --show-error \
          -u ":$GOATCOUNTER_API_KEY" \
          -H "Content-Type: application/json" \
          "https://ciphercook.goatcounter.com/api/v0/stats/total?start=2026-07-01T00:00:00Z&end=$(date -u '+%Y-%m-%dT23:59:59Z')" \
          > /tmp/goatcounter.json

          total=$(jq '.total' /tmp/goatcounter.json)

          jq -n \
            --argjson total "$total" \
            --arg updated_at "$(date -u '+%-d %b %Y, %H:%M UTC')" \
            '{
              total_lifetime_views: $total,
              updated_at: $updated_at
            }' \
            > _data/stats.json

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/stats.json

          if git diff --cached --quiet; then
            echo "Stats have not changed."
            exit 0
          fi

          git commit -m "Update blog stats"
          git push