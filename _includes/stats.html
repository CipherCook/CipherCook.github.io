<div class="stats">
  <h2>Stats</h2>

  <ul>
    <li>
      Posts: {{ site.posts.size }}
    </li>

    <li>
      All time views: <span id="goatcounter-total">...</span>
    </li>
  </ul>
</div>

<script>
  fetch("https://ciphercook.goatcounter.com/counter/TOTAL.json")
    .then(response => response.json())
    .then(data => {
      document.getElementById("goatcounter-total").textContent = data.count;
    });
</script>
