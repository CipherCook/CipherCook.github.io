<div class="stats">

  <h2>Stats</h2>

  <ul>
    <li>
      Posts: {{ site.posts.size }}
    </li>

    <li>
      Views: <span id="goatcounter-total"></span>
    </li>
  </ul>

</div>

<script>
  var t = setInterval(function() {
    if (window.goatcounter && window.goatcounter.visit_count) {
      clearInterval(t);

      window.goatcounter.visit_count({
        append: "#goatcounter-total",
        path: "TOTAL",
        no_branding: true
      });
    }
  }, 100);
</script>
