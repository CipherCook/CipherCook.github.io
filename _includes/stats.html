<div class="stats">
  <h2>Stats</h2>

  <ul>
    <li>
      Posts: {{ site.posts.size }}
    </li>

    <li>
      Views: {{ site.data.stats.total_lifetime_views }}
    </li>
    <li>
      Views last updated:
      {{ site.data.stats.updated_at | date: "%-d %b %Y, %H:%M" }}
    </li>
  </ul>
</div>
